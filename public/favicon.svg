      d="M 46 76 C 34 66 22 55 9 46 C 5 43 1 48 4 52 C 15 63 28 77 38 86 C 42 89 47 84 46 76 Z"
      fill="url(#verve-favicon-gold)"
    />

    <!-- Ray 3 (Lower-middle radiant ray) -->
